plugins {
  id "com.android.application"
}

android {
  namespace "com.grokbot.reconstructed"
  compileSdk 35
  defaultConfig {
    applicationId "com.grokbot.reconstructed"
    minSdk 26
    targetSdk 35
    versionCode 1
    versionName "0.18.0-reconstructed.1"
  }
  buildTypes {
    debug {
      debuggable true
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.webkit:webkit:1.12.1"
}
